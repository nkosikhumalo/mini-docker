# The Java control plane and the Go daemon must run as users permitted to access
# the same Unix socket (the Go daemon creates it with mode 0660).
server.address=${MINIDOCK_API_BIND_ADDRESS:127.0.0.1}
minidock.runtime-socket=${MINIDOCK_SOCKET:/tmp/minidock-runtime.sock}
minidock.images-directory=${MINIDOCK_IMAGES_DIR:${user.home}/.local/share/minidock/images}
minidock.containers-directory=${MINIDOCK_CONTAINERS_DIR:${user.home}/.local/share/minidock/containers}
minidock.state-file=${MINIDOCK_STATE_FILE:${user.home}/.local/share/minidock/state.json}
spring.servlet.multipart.max-file-size=8GB
spring.servlet.multipart.max-request-size=8GB
